services:
  frontend-api:
    build:
      context: .
      dockerfile: apps/agent-platform-services/Dockerfile
      target: api
    environment:
      ASPNETCORE_URLS: ${ASPNETCORE_URLS}
      ConnectionStrings__Platform: ${PLATFORM_CONNECTION_STRING}
      KnowledgeBase__Url: http://knowledge-base-api:8082
      KnowledgeBase__ServiceKey: ${KNOWLEDGE_BASE_SERVICE_KEY}
      Nats__Url: ${NATS_URL}
      Nats__StreamName: ${NATS_STREAM_NAME}
      Clerk__Issuer: ${CLERK_JWT_ISSUER}
      Administration__BootstrapAdminClerkUserIds: ${ADMINISTRATION__BOOTSTRAP_ADMIN_CLERK_USER_IDS:-}
      OutboundHttp__AllowedLlmHosts: ${OUTBOUND_HTTP__ALLOWED_LLM_HOSTS:-}
      OutboundHttp__AllowedMcpHosts: ${OUTBOUND_HTTP__ALLOWED_MCP_HOSTS:-}
      OutboundHttp__AllowedWebhookHosts: ${OUTBOUND_HTTP__ALLOWED_WEBHOOK_HOSTS:-}
      OutboundHttp__InternalMcpHosts: ${OUTBOUND_HTTP__INTERNAL_MCP_HOSTS:-}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      default:
        aliases:
          # Existing built-in MCP configurations use this internal hostname.
          - api
      mcp: {}
    restart: unless-stopped

  agent-api:
    build:
      context: .
      dockerfile: apps/agent-platform-services/Dockerfile
      target: agent-api
    environment:
      ASPNETCORE_URLS: http://+:8081
      ConnectionStrings__Platform: ${PLATFORM_CONNECTION_STRING}
      Nats__Url: ${NATS_URL}
      Nats__StreamName: ${NATS_STREAM_NAME}
      Clerk__Issuer: ${CLERK_JWT_ISSUER}
      OutboundHttp__AllowedLlmHosts: ${OUTBOUND_HTTP__ALLOWED_LLM_HOSTS:-}
      OutboundHttp__AllowedMcpHosts: ${OUTBOUND_HTTP__ALLOWED_MCP_HOSTS:-}
      OutboundHttp__AllowedWebhookHosts: ${OUTBOUND_HTTP__ALLOWED_WEBHOOK_HOSTS:-}
      OutboundHttp__InternalMcpHosts: ${OUTBOUND_HTTP__INTERNAL_MCP_HOSTS:-}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped
    networks:
    - default
    - mcp

  knowledge-base-api:
    build:
      context: .
      dockerfile: apps/knowledge-base/Dockerfile
      target: api
    environment:
      ASPNETCORE_URLS: http://+:8082
      ConnectionStrings__KnowledgeBase: ${KNOWLEDGE_BASE_CONNECTION_STRING:-Host=postgres;Port=5432;Database=${KNOWLEDGE_BASE_POSTGRES_DB:-knowledge_base};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}}
      Clerk__Issuer: ${CLERK_JWT_ISSUER}
      KnowledgeBase__ServiceKey: ${KNOWLEDGE_BASE_SERVICE_KEY}
    depends_on:
      knowledge-base-database-bootstrap:
        condition: service_completed_successfully
    networks:
      default:
        aliases:
          - knowledge-base-api
      mcp: {}
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/agent-platform-services/Dockerfile
      target: worker
    environment:
      ConnectionStrings__Platform: ${PLATFORM_CONNECTION_STRING}
      Nats__Url: ${NATS_URL}
      Nats__StreamName: ${NATS_STREAM_NAME}
      OutboundHttp__AllowedLlmHosts: ${OUTBOUND_HTTP__ALLOWED_LLM_HOSTS:-}
      OutboundHttp__AllowedMcpHosts: ${OUTBOUND_HTTP__ALLOWED_MCP_HOSTS:-}
      OutboundHttp__AllowedWebhookHosts: ${OUTBOUND_HTTP__ALLOWED_WEBHOOK_HOSTS:-}
      OutboundHttp__InternalMcpHosts: ${OUTBOUND_HTTP__INTERNAL_MCP_HOSTS:-}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - default
      - mcp
    restart: unless-stopped

  embedding-worker:
    build:
      context: .
      dockerfile: apps/knowledge-base/Dockerfile
      target: worker
    environment:
      ConnectionStrings__KnowledgeBase: ${KNOWLEDGE_BASE_CONNECTION_STRING:-Host=postgres;Port=5432;Database=${KNOWLEDGE_BASE_POSTGRES_DB:-knowledge_base};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}}
    depends_on:
      knowledge-base-database-bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: apps/agent-platform-admin/Dockerfile
      args:
        JIM_AGENT_ID: ${JIM_AGENT_ID:-}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    environment:
      API_INTERNAL_URL: http://frontend-api:8080
      THREAD_API_INTERNAL_URL: http://agent-api:8081
      KNOWLEDGE_BASE_API_INTERNAL_URL: http://knowledge-base-api:8082
      NEXT_PUBLIC_JIM_AGENT_ID: ${JIM_AGENT_ID:-}
      JIM_AGENT_API_KEY: ${JIM_AGENT_API_KEY:-}
      AGENT_EVENTS_WEBHOOK_SECRET: ${AGENT_EVENTS_WEBHOOK_SECRET:-}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
    depends_on:
      - frontend-api
      - agent-api
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.agent-platform-admin.rule=Host(`agent-platform.${DNS_SUFFIX}`)"
      - "traefik.http.routers.agent-platform-admin.entrypoints=https"
      - "traefik.http.routers.agent-platform-admin.tls=true"
      - "traefik.http.routers.agent-platform-admin.tls.certresolver=zerossl"
      - "traefik.http.services.agent-platform-admin.loadbalancer.server.port=3000"
    networks:
      - default
      - traefik

  postgres:
    image: pgvector/pgvector:pg17-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  knowledge-base-database-bootstrap:
    image: postgres:17-trixie
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PLATFORM_POSTGRES_USER: ${POSTGRES_USER}
      KNOWLEDGE_BASE_POSTGRES_DB: ${KNOWLEDGE_BASE_POSTGRES_DB:-knowledge_base}
    entrypoint: ["/bin/sh", "-ec"]
    command: ["until pg_isready --host=postgres --username=\"$$PLATFORM_POSTGRES_USER\" --dbname=postgres; do sleep 1; done; if ! psql --host=postgres --username=\"$$PLATFORM_POSTGRES_USER\" --dbname=postgres --tuples-only --no-align --command=\"SELECT 1 FROM pg_database WHERE datname = '$$KNOWLEDGE_BASE_POSTGRES_DB'\" | grep -qx 1; then psql --host=postgres --username=\"$$PLATFORM_POSTGRES_USER\" --dbname=postgres --command=\"CREATE DATABASE \\\"$$KNOWLEDGE_BASE_POSTGRES_DB\\\"\"; fi"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  nats-data:

networks:
  traefik:
    external: true
  mcp:
    name: ${MCP_NETWORK_NAME:-agent-platform-mcp}
    external: true
