services:
  api:
    build:
      context: .
      dockerfile: apps/agent-platform-services/Dockerfile
      target: api
    environment:
      ASPNETCORE_URLS: ${ASPNETCORE_URLS}
      ConnectionStrings__Platform: ${PLATFORM_CONNECTION_STRING}
      Nats__Url: ${NATS_URL}
      Nats__StreamName: ${NATS_STREAM_NAME}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/agent-platform-services/Dockerfile
      target: worker
    environment:
      ConnectionStrings__Platform: ${PLATFORM_CONNECTION_STRING}
      Nats__Url: ${NATS_URL}
      Nats__StreamName: ${NATS_STREAM_NAME}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: apps/agent-platform-admin/Dockerfile
      args:
        JIM_AGENT_ID: ${JIM_AGENT_ID:-}
    environment:
      API_INTERNAL_URL: http://api:8080
      NEXT_PUBLIC_JIM_AGENT_ID: ${JIM_AGENT_ID:-}
    ports:
      - "${ADMIN_PORT}:3000"
    depends_on:
      - api
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  nats-data:
