services:
  api:
    build:
      context: .
      dockerfile: apps/agent-platform-services/Dockerfile
      target: api
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Platform: Host=postgres;Port=5432;Database=agent_platform;Username=agent;Password=agent
      Nats__Url: nats://nats:4222
      Nats__StreamName: AGENT_PLATFORM
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/agent-platform-services/Dockerfile
      target: worker
    environment:
      ConnectionStrings__Platform: Host=postgres;Port=5432;Database=agent_platform;Username=agent;Password=agent
      Nats__Url: nats://nats:4222
      Nats__StreamName: AGENT_PLATFORM
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: apps/agent-platform-admin/Dockerfile
    ports:
      - "3010:3000"
    depends_on:
      - api
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agent_platform
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
    ports:
      - "5420:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_platform"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  nats-data:
